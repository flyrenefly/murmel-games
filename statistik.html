<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05050c" />
    <title>Statistik – Murmel</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f7f6f2;
        --fg: #1d1c1a;
        --muted: #5d5a54;
        --accent: #1f5fa8;
        --card: #ffffff;
        --line: #e3e0d8;
        --bar: #1f5fa8;
        --bar-soft: #c9d8ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b12;
          --fg: #e9e7e1;
          --muted: #a6a29a;
          --accent: #7fb2ff;
          --card: #15151f;
          --line: #2a2a38;
          --bar: #7fb2ff;
          --bar-soft: #2a3a55;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 20px;
        margin: 32px 0 12px;
      }
      .muted {
        color: var(--muted);
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 24px 0;
      }
      input,
      select,
      button {
        font: inherit;
        min-height: 44px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
      }
      input {
        flex: 1 1 240px;
      }
      button {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
        font-weight: 600;
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      .tile {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }
      .tile b {
        display: block;
        font-size: 34px;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }
      .chart {
        display: grid;
        gap: 4px;
      }
      .row {
        display: grid;
        grid-template-columns: 92px 1fr;
        align-items: center;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }
      .track {
        position: relative;
        min-height: 26px;
        display: flex;
        align-items: center;
      }
      .fill {
        height: 20px;
        border-radius: 6px;
        background: var(--bar);
        min-width: 2px;
      }
      .track span {
        margin-left: 8px;
        white-space: nowrap;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid var(--line);
      }
      th:not(:first-child),
      td:not(:first-child) {
        text-align: right;
      }
      #status:empty {
        display: none;
      }
      #status {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 16px;
      }
    </style>
    <script type="module" src="/src/statistik.ts"></script>
  </head>
  <body>
    <main>
      <h1>Statistik</h1>
      <p class="muted">Anonym gezählt: Spieler pro Tag, gestartete und gelöste Levels. Keine Cookies, keine IP-Adressen.</p>

      <form id="login">
        <label for="token" class="muted" style="flex-basis: 100%">Zugangsschlüssel (STATS_TOKEN vom Server)</label>
        <input id="token" type="password" autocomplete="current-password" required />
        <select id="range" aria-label="Zeitraum">
          <option value="7">7 Tage</option>
          <option value="30" selected>30 Tage</option>
          <option value="90">90 Tage</option>
          <option value="365">1 Jahr</option>
        </select>
        <button type="submit">Anzeigen</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="result" hidden>
        <div class="tiles">
          <div class="tile"><span class="muted">Spieler heute</span><b id="today">–</b></div>
          <div class="tile"><span class="muted">Spieler pro Tag (Ø)</span><b id="avg">–</b></div>
          <div class="tile"><span class="muted">Levelstarts</span><b id="starts">–</b></div>
          <div class="tile"><span class="muted">Gelöst</span><b id="solved">–</b></div>
        </div>

        <h2>Spieler pro Tag</h2>
        <div id="chart" class="chart" role="list"></div>

        <h2>Meistgespielte Levels</h2>
        <table>
          <thead>
            <tr><th scope="col">Level</th><th scope="col">Starts</th><th scope="col">Gelöst</th></tr>
          </thead>
          <tbody id="levels"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
