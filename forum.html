<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)" />
    <title>Forum – Murmel</title>
    <meta name="description" content="Forum zu Murmel: Fehler melden, Verbesserungen vorschlagen, Fragen stellen und über Levels reden." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f2;
        --fg: #1d1c1a;
        --muted: #5d5a54;
        --accent: #1f5fa8;
        --on-accent: #ffffff;
        --card: #ffffff;
        --line: #e3e0d8;
        --soft: #efede7;
        --seg-on: #ffffff;
        --danger: #a8321f;
        --open-bg: #ecebe6;
        --open-fg: #45423c;
        --planned-bg: #dde8f6;
        --planned-fg: #174a85;
        --done-bg: #dcefe1;
        --done-fg: #1e6234;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b12;
          --fg: #e9e7e1;
          --muted: #a6a29a;
          --accent: #7fb2ff;
          --on-accent: #0b0b12;
          --card: #15151f;
          --line: #2a2a38;
          --soft: #1d1d29;
          --seg-on: #3a3a52;
          --danger: #ff9580;
          --open-bg: #262633;
          --open-fg: #d2cfc7;
          --planned-bg: #1c2d47;
          --planned-fg: #a9cbff;
          --done-bg: #18321f;
          --done-fg: #9ad8a9;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      a {
        color: var(--accent);
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px max(16px, env(safe-area-inset-left));
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: saturate(1.4) blur(14px);
        -webkit-backdrop-filter: saturate(1.4) blur(14px);
        border-bottom: 1px solid var(--line);
      }
      @media (prefers-reduced-transparency: reduce) {
        .top {
          background: var(--bg);
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
      }
      .top a,
      .top button.link {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-weight: 600;
      }
      #ich {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 15px;
        text-align: right;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.15;
        margin: 8px 0 4px;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 24px;
        line-height: 1.25;
        margin: 4px 0 8px;
        overflow-wrap: anywhere;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 15px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: var(--fg);
      }
      button {
        min-height: 44px;
        padding: 8px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      button.link {
        border: 0;
        background: none;
        padding: 8px 4px;
        color: var(--accent);
        min-height: 44px;
      }
      button.danger {
        color: var(--danger);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      input,
      select,
      textarea {
        min-height: 44px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        width: 100%;
      }
      textarea {
        min-height: 160px;
        resize: vertical;
        line-height: 1.5;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 16px 0 6px;
      }
      .hint {
        font-size: 15px;
        color: var(--muted);
        margin: 6px 0 0;
      }

      /* list toolbar: category as segmented control, status and order as menus */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 20px 0 12px;
      }
      .segmented {
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: 12px;
        background: var(--soft);
        overflow-x: auto;
        max-width: 100%;
        scrollbar-width: none;
      }
      .segmented button {
        border: 0;
        background: none;
        border-radius: 10px;
        padding: 6px 12px;
        white-space: nowrap;
        color: var(--fg);
      }
      .segmented button[aria-pressed='true'] {
        background: var(--seg-on);
        font-weight: 600;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.12);
      }
      .toolbar select {
        width: auto;
        flex: 0 0 auto;
      }
      .toolbar .spacer {
        flex: 1 1 auto;
      }

      .list {
        list-style: none;
        padding: 0;
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        overflow: hidden;
      }
      .list li + li {
        border-top: 1px solid var(--line);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        padding: 14px 16px;
        color: inherit;
        text-decoration: none;
      }
      .row:hover {
        background: var(--soft);
      }
      .row b {
        font-size: 17px;
        overflow-wrap: anywhere;
      }
      .row .meta {
        grid-column: 1;
        font-size: 15px;
        color: var(--muted);
      }
      .row .votes {
        grid-row: 1 / span 2;
        grid-column: 2;
        align-self: center;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 15px;
        text-align: right;
      }
      .row .votes svg {
        width: 16px;
        height: 16px;
        vertical-align: -3px;
        margin-right: 4px;
      }
      .row.hidden-topic b {
        text-decoration: line-through;
      }

      .chip {
        display: inline-block;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        padding: 5px 8px;
        border-radius: 999px;
        vertical-align: 2px;
        margin-right: 6px;
        white-space: nowrap;
      }
      .chip.offen {
        background: var(--open-bg);
        color: var(--open-fg);
      }
      .chip.geplant {
        background: var(--planned-bg);
        color: var(--planned-fg);
      }
      .chip.erledigt {
        background: var(--done-bg);
        color: var(--done-fg);
      }
      .chip.cat {
        background: none;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .chip.team {
        background: var(--accent);
        color: var(--on-accent);
      }
      .chip.warn {
        background: var(--danger);
        color: var(--card);
      }

      .post {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 16px 6px;
        margin: 12px 0;
      }
      .post.first {
        border-width: 1px;
      }
      .post.is-hidden {
        border-style: dashed;
      }
      .post header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 8px;
        font-size: 15px;
        color: var(--muted);
      }
      .post header strong {
        color: var(--fg);
        font-size: 17px;
      }
      .post .body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 8px 0;
      }
      .post .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0 12px;
        margin: 0 -4px;
      }
      .post .actions button.link {
        font-size: 15px;
        color: var(--muted);
      }
      .post .actions button.link.danger {
        color: var(--danger);
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        font-size: 15px;
        color: var(--muted);
        margin: 4px 0 8px;
      }
      .facts code {
        font: 14px ui-monospace, 'SF Mono', Consolas, monospace;
        color: var(--fg);
      }
      .topic-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
      }
      .vote[aria-pressed='true'] {
        background: var(--planned-bg);
        border-color: var(--accent);
        color: var(--planned-fg);
        font-weight: 600;
      }
      .vote svg {
        width: 18px;
        height: 18px;
        vertical-align: -3px;
        margin-right: 6px;
      }
      .admin {
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 8px 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .admin select {
        width: auto;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        margin: 16px 0;
      }
      .card h3 {
        margin: 0 0 4px;
        font-size: 19px;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      .msg {
        border-radius: 12px;
        padding: 12px 16px;
        margin: 12px 0;
        background: var(--soft);
      }
      .msg.error {
        background: color-mix(in srgb, var(--danger) 14%, var(--card));
      }
      .msg:empty {
        display: none;
      }
      .empty {
        text-align: center;
        padding: 40px 16px;
        color: var(--muted);
      }
      .more {
        display: flex;
        justify-content: center;
        margin: 16px 0;
      }
      .skeleton {
        height: 72px;
        border-radius: 16px;
        background: var(--soft);
        margin: 8px 0;
      }
      footer {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 16px 32px;
        font-size: 15px;
        color: var(--muted);
      }
    </style>
    <script type="module" src="/src/forum-seite.ts"></script>
  </head>
  <body>
    <nav class="top" aria-label="Forum">
      <a href="./">‹ Zum Spiel</a>
      <div id="ich" aria-live="polite"></div>
    </nav>
    <main>
      <div id="view" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div></div>
    </main>
    <footer>
      Beiträge sind öffentlich und erscheinen mit deinem Anzeigenamen, nie mit deiner Mailadresse.
      <a href="datenschutz.html">Datenschutz</a> · <a href="impressum.html">Impressum</a>
    </footer>
    <noscript><p style="padding: 16px">Das Forum braucht JavaScript.</p></noscript>
  </body>
</html>
