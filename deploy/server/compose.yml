# Murmel auf dem VPS (/opt/murmel). Nur Caddy veröffentlicht Ports; API und Datenbank bleiben im
# internen Netz (Docker umgeht ufw bei veröffentlichten Ports).
name: murmel

# Protokolle aller Dienste: höchstens 3 × 10 MB je Dienst, ältere Einträge werden überschrieben
# (Datenschutzerklärung „Hosting und Server-Protokolle“).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    logging: *logging
    image: murmel-api:${MURMEL_VERSION}
    restart: unless-stopped
    environment:
      # Konten: Adresse des Spiels (Passkeys, Login-Links), Admins und Mailversand aus /opt/murmel/.env.
      # Ohne SMTP-Werte meldet die Anmeldung, dass der Mailversand nicht eingerichtet ist.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://murmel.games}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Konten Stufe 2 (docs/SPEC-konten.md): Anmeldung mit Google, GitHub, Apple. Fehlt ein Wert, ist der
      # Anbieter aus (kein Knopf, Routen 404). Der Apple-Schlüssel kommt als Datei, nicht als Variable.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      DATABASE_URL: postgres://murmel:${POSTGRES_PASSWORD}@db:5432/murmel
      MURMEL_VERSION: ${MURMEL_VERSION}
      # Lesezugang zur Statistik (/statistik.html); leer = Statistik geschlossen
      STATS_TOKEN: ${STATS_TOKEN:-}
      # Zu zweit spielen: TURN-Zugangsdaten je Raum (leer = Räume ohne TURN, das Spiel verbindet dann nicht)
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      SITE_ADDRESS: ${SITE_ADDRESS}
      # Erinnerung an das Tageslevel (docs/SPEC-webpush.md): VAPID-Schlüssel; fehlt einer, ist Web Push aus
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GAME_DIR: /game
    # Bestenliste: Spielcode der aktiven Version zum Nachspielen (update.sh legt ihn an); fehlt er,
    # nimmt die API keine Läufe an, alles andere läuft.
    volumes:
      - ./game/${MURMEL_VERSION}:/game:ro
      # Apple-Schlüssel (chmod 600, lesbar für UID 1000 = Benutzer node im Container), schreibgeschützt.
      # Fehlt /opt/murmel/apple-signin.p8, hängt release.sh /dev/null ein (Apple aus) – sonst legte
      # Docker an dieser Stelle ein leeres Verzeichnis als root an.
      - ${APPLE_KEY_HOST:-./apple-signin.p8}:/run/murmel/apple-signin.p8:ro
    depends_on:
      db:
        condition: service_healthy

  # Nachtlauf der Lösbarkeitsprüfung (docs/SPEC-loesbarkeit.md): startet nie mit `up`, nur aus
  # /opt/murmel/loesbarkeit.sh (murmel-loesbarkeit.timer). Ein Kern, kleiner CPU-Anteil, nice 19 –
  # die API behält Vorrang. Das Spiel der aktiven Version liegt schreibgeschützt unter /game.
  loesbarkeit:
    logging: *logging
    image: murmel-api:${MURMEL_VERSION}
    profiles: ["nacht"]
    command: ["nice", "-n", "19", "node", "src/loesbarkeit-job.ts"]
    environment:
      DATABASE_URL: postgres://murmel:${POSTGRES_PASSWORD}@db:5432/murmel
      MURMEL_VERSION: ${MURMEL_VERSION}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://murmel.games}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GAME_DIR: /game
    volumes:
      - ${LOESBARKEIT_DIR:-./loesbarkeit}:/game:ro
    cpus: 1
    cpu_shares: 128
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy

  # TURN-Server für „Zu zweit spielen“ (docs/SPEC-mehrspieler.md): nur Relay, Zugang je Raum über
  # das gemeinsame Geheimnis TURN_SECRET aus /opt/murmel/.env (die API rechnet die Zugangsdaten).
  # Host-Netz: Relay-Ports ohne Docker-NAT, und ufw gilt (3478/udp+tcp, 49160–49200/udp, „turn“).
  # Das Geheimnis landet in einer Datei im Container, nicht auf der Kommandozeile.
  # Rückweg: docker compose stop turn; ufw-Regeln „turn“ löschen (docs/SERVER.md).
  turn:
    logging: *logging
    image: coturn/coturn:4.7-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_IP: ${TURN_IP:-}
    volumes:
      - ./turnserver.conf:/etc/coturn/murmel.conf:ro
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$${TURN_SECRET}" ]; then echo "TURN_SECRET fehlt in /opt/murmel/.env - TURN aus"; exec sleep 2147483647; fi
        umask 077
        conf=/tmp/turnserver.conf
        cat /etc/coturn/murmel.conf > "$$conf"
        printf 'static-auth-secret=%s\n' "$${TURN_SECRET}" >> "$$conf"
        if [ -n "$${TURN_IP}" ]; then printf 'listening-ip=%s\nrelay-ip=%s\n' "$${TURN_IP}" "$${TURN_IP}" >> "$$conf"; fi
        unset TURN_SECRET
        exec turnserver -c "$$conf"
    mem_limit: 256m
    cpus: 1

  db:
    logging: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: murmel
      POSTGRES_DB: murmel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmel -d murmel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  db_data:
