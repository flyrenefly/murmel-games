# coturn für „Zu zweit spielen“ (docs/SPEC-mehrspieler.md). Nur Relay für den WebRTC-Datenkanal
# zwischen zwei Mitspielern; die Browser verbinden sich ausschließlich hierüber (iceTransportPolicy
# „relay“), damit keiner die IP-Adresse des anderen sieht.
# Das Geheimnis (static-auth-secret) steht NICHT hier: Es kommt aus /opt/murmel/.env (TURN_SECRET)
# und wird beim Start im Container angehängt (compose.yml, Dienst turn). Ebenso listening-/relay-ip
# aus TURN_IP.

# Zugangsdaten nach dem TURN-REST-Verfahren: Die API gibt sie je Raum für 1 h aus.
use-auth-secret
realm=murmel.games
fingerprint

# Ports: 3478 UDP/TCP, Relay 49160–49200/udp (ufw-Regeln mit Kommentar „turn“)
listening-port=3478
min-port=49160
max-port=49200
no-tls
no-dtls
no-tcp-relay
no-cli
no-multicast-peers
no-rfc5780
response-origin-only-with-rfc5780

# Kein Relay zu privaten, internen oder besonderen Adressen (auch nicht ins Docker-Netz)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::-::ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Grenzen: Sitzungen je Zugang und insgesamt, Bandbreite je Sitzung und gesamt (Bytes/s).
# Ein Spiel braucht etwa 10–30 KB/s je Richtung.
user-quota=4
total-quota=200
max-bps=96000
bps-capacity=8000000
max-allocate-lifetime=3600
stale-nonce=600

# Keine Logs: keine IP-Adressen auf der Platte oder im Docker-Log
no-stdout-log
log-file=/dev/null
simple-log
no-software-attribute
