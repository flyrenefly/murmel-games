<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c14" />
    <title>Leveleditor – Murmel</title>
    <meta name="description" content="Eigene Murmel-Levels bauen, sofort probespielen und per Link teilen – im Browser, ohne Anmeldung." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body class="ed">
    <header class="ed-bar">
      <a class="ed-back" href="./" aria-label="Zurück zum Spiel">‹ Spiel</a>
      <div class="ed-meta">
        <input id="ed-title" type="text" maxlength="80" placeholder="Titel des Levels" aria-label="Titel" autocomplete="off" />
        <input id="ed-author" type="text" maxlength="80" placeholder="Autor" aria-label="Autor" autocomplete="nickname" />
      </div>
      <div class="ed-actions">
        <button id="ed-undo" type="button" class="icon" aria-label="Rückgängig" title="Rückgängig (Strg+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3" /></svg>
        </button>
        <button id="ed-redo" type="button" class="icon" aria-label="Wiederholen" title="Wiederholen (Strg+Y)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h3" /></svg>
        </button>
        <button id="ed-menu" type="button" aria-haspopup="dialog">Level</button>
        <button id="ed-share" type="button">Teilen</button>
        <button id="ed-publish" type="button">Veröffentlichen</button>
        <button id="ed-test" type="button" class="primary"><span class="ed-long">Probe</span>spielen</button>
      </div>
    </header>

    <div class="ed-work">
      <aside class="ed-palette" aria-label="Palette">
        <div class="ed-tools" role="radiogroup" aria-label="Werkzeug">
          <label><input type="radio" name="tool" value="paint" checked /><span>Malen</span></label>
          <label><input type="radio" name="tool" value="rect" /><span>Rechteck</span></label>
          <label><input type="radio" name="tool" value="erase" /><span>Radierer</span></label>
          <label><input type="radio" name="tool" value="select" /><span>Auswahl</span></label>
        </div>
        <input id="ed-search" type="search" placeholder="Suchen: Tür, Eis, Rotor …" aria-label="Palette durchsuchen" />
        <div id="ed-groups" class="ed-groups"></div>
      </aside>

      <main class="ed-stage" id="ed-stage">
        <canvas id="ed-board" role="img" aria-label="Spielfeld des Levels"></canvas>
      </main>

      <aside class="ed-inspector" aria-label="Eigenschaften">
        <section id="ed-current" class="ed-panel"></section>
        <section id="ed-selection" class="ed-panel" hidden></section>
        <section id="ed-status" class="ed-panel" aria-live="polite"></section>
      </aside>
    </div>

    <dialog id="ed-dialog" aria-labelledby="ed-dialog-title">
      <h2 id="ed-dialog-title"></h2>
      <div id="ed-dialog-body"></div>
      <div class="ed-dialog-buttons" id="ed-dialog-buttons"></div>
    </dialog>
    <div id="ed-toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/editor/app.ts"></script>
  </body>
</html>
