name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Server (API): eigene Abhängigkeiten, Typprüfung und Tests
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 14
