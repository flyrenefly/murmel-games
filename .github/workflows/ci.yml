name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Echte Datenbank für die Server-Tests (db.test.ts); nur in der CI, Wegwerf-Zugang.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: murmel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d murmel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Lösbarkeit (docs/SPEC-loesbarkeit.md): jedes Level startet und läuft 5 s ohne Fehler,
      # jede Lösung unter solutions/ gewinnt noch – sonst kommt die Änderung nicht auf main.
      - run: npm run test:tools
      - run: npm run check:levels
      - run: npm run check:solutions
      - run: npm run build
      # Server (API): eigene Abhängigkeiten, Typprüfung und Tests
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/murmel_test
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 14
