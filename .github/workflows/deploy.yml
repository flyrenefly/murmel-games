name: Deploy murmel.games

# Builds the site and mirrors dist/ to the IONOS webspace folder /murmel-games
# (the SFTP user is confined to that folder). Needs the secrets IONOS_SFTP_USER
# and IONOS_SFTP_PASSWORD (both secrets, so the logs mask them).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: home19679418.1and1-data.host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Levelseiten (docs/SPEC-levelseiten.md) NICHT auf den IONOS-Webspace (Nutzerentscheidung 13.11.2026):
      # Der Webspace ist nur Notbetrieb und braucht nur das spielbare Spiel; Levelseiten und Vorschaubilder
      # (~2300 Dateien, ~90 MB) würden jeden Upload stark verlängern. Live liefert sie der VPS aus.
      # MURMEL_LEVELSEITEN=0 überspringt das Vite-Plugin; die Sitemap bleibt dann die aus public/.
      - run: npm run build
        env:
          MURMEL_LEVELSEITEN: '0'
      # Absicherung, falls das Plugin doch lief: alles vom Generator Erzeugte entfernen.
      # deploy-sftp.mjs löscht remote jede Datei, die hier fehlt – Reste auf dem Webspace verschwinden also.
      - name: Levelseiten nicht spiegeln
        run: |
          rm -rf dist/level
          cp public/sitemap.xml dist/sitemap.xml
      - name: Check credentials
        env:
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::IONOS_SFTP_USER or IONOS_SFTP_PASSWORD secret missing"
            exit 1
          fi
      - name: Upload via SFTP
        env:
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        # Node SFTP client with pinned host key (no apt packages needed).
        run: node tools/deploy-sftp.mjs dist
      - name: Check site
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' http://murmel.games/ || true)
          echo "http://murmel.games/ -> $code"
