  <body>
    <canvas id="game"></canvas>
    <canvas id="classic" hidden></canvas>
    <div id="crt" aria-hidden="true"></div>

    <header id="hud">
      <div class="hud-left">
        <strong id="hud-title"></strong>
        <span id="hud-pairs"></span>
        <span id="hud-falls"></span>
        <span id="hud-items" hidden></span>
        <span id="hud-esc">Esc = Menü</span>
      </div>
      <div class="hud-right">
        <button id="btn-rest" title="Die jetzige Haltung wird zur Ruhelage (oder doppelt aufs Spielfeld tippen)">Ruhelage</button>
        <button id="btn-rotate" title="Inventar drehen (Rechtsklick oder Tab)" hidden>Drehen</button>
        <button id="btn-drop" title="Ersten Gegenstand ablegen (Leertaste oder Klick)" hidden>Ablegen</button>
        <button id="btn-swap" title="Murmel wechseln (Leertaste oder Klick)" hidden>Murmel wechseln</button>
        <button id="btn-levels" title="Levelauswahl">Levels</button>
        <button id="btn-tipp" title="Den nächsten Schritt zeigen (H)" hidden>Tipp?</button>
        <button id="btn-restart" title="Neustart (R)">Neustart</button>
        <button id="btn-theme" title="Grafikstil wechseln (T)">Stil</button>
      </div>
    </header>

    <div id="overlay" hidden>
      <div class="card">
        <h1 id="ov-title"></h1>
        <p id="ov-text"></p>
        <div id="level-list" hidden></div>
        <div id="ov-form" hidden></div>
        <div id="ov-buttons"></div>
      </div>
    </div>

    <div id="toast" hidden></div>

    <div id="loading">Murmel wird geladen …</div>

    <noscript>
      <h1>Murmel – Murmelspiel wie Oxyd und Enigma im Browser</h1>

      </p>
