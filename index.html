<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05050c" />
    <meta name="description" content="Murmel – ein freies Murmel-Rätselspiel im Browser. Rolle die Murmel und decke die Signalsteine paarweise auf." />
    <title>Murmel</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="crt" aria-hidden="true"></div>

    <header id="hud">
      <div class="hud-left">
        <strong id="hud-title"></strong>
        <span id="hud-pairs"></span>
        <span id="hud-falls"></span>
      </div>
      <div class="hud-right">
        <button id="btn-levels" title="Levelauswahl">Levels</button>
        <button id="btn-restart" title="Neustart (R)">Neustart</button>
        <button id="btn-theme" title="Grafikstil wechseln (T)">Stil</button>
      </div>
    </header>

    <div id="overlay" hidden>
      <div class="card">
        <h1 id="ov-title"></h1>
        <p id="ov-text"></p>
        <div id="level-list" hidden></div>
        <div id="ov-buttons"></div>
      </div>
    </div>

    <div id="loading">Murmel wird geladen …</div>

    <footer id="credits">
      Freie Software (GPL-3.0-or-later) ·
      <a href="https://github.com/flyrenefly/murmel-games" target="_blank" rel="noopener">Quellcode</a> ·
      inspiriert von den Murmel-Klassikern der 90er
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
